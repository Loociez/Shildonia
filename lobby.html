<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixel Art Collab - Lobby</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
    min-height: 100vh;
  }
  h1 {
    margin-bottom: 1rem;
  }
  #username-section {
    margin-bottom: 1rem;
  }
  label, input, button {
    font-size: 1rem;
  }
  input {
    padding: 0.3rem 0.5rem;
    margin-left: 0.5rem;
    border-radius: 4px;
    border: none;
  }
  button {
    margin-left: 0.5rem;
    background: #f44336;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 0.4rem 0.8rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover {
    background: #d32f2f;
  }
  #username-message {
    color: #4caf50;
    margin-top: 0.25rem;
    display: none;
  }
  #session-actions {
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  #session-list {
    margin-top: 2rem;
    max-width: 400px;
    width: 100%;
  }
  #session-list h3 {
    margin-bottom: 0.5rem;
  }
  #session-list ul {
    list-style: none;
    padding-left: 0;
  }
  #session-list li {
    background: #222;
    margin-bottom: 0.5rem;
    padding: 0.5rem 0.75rem;
    border-radius: 4px;
    cursor: pointer;
  }
  #session-list li:hover {
    background: #333;
  }
</style>
</head>
<body>
  <h1>Collaborative Pixel Art Lobby</h1>

  <div id="username-section">
    <label for="username-input">Username:</label>
    <input type="text" id="username-input" placeholder="Enter username" maxlength="20" />
    <button id="save-username-btn">Save</button>
    <div id="username-message">Username saved!</div>
  </div>

  <div id="session-actions">
    <button id="create-session-btn">Create New Art Session</button>
  </div>

  <div id="session-list">
    <h3>Join Existing Sessions:</h3>
    <ul id="sessions-ul"></ul>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="lobby.js"></script>
</body>
</html>
