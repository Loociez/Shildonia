<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixel Art Collab - Lobby</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 1rem;
  }
  h1 {
    margin-bottom: 1rem;
  }
  #user-info {
    margin-bottom: 1rem;
  }
  #session-controls {
    margin-bottom: 2rem;
  }
  button {
    background: #f44336;
    border: none;
    color: white;
    padding: 0.5rem 1rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    margin-right: 0.5rem;
  }
  button:hover {
    background: #d32f2f;
  }
  #sessions-list, #gallery-list {
    background: #222;
    border: 2px solid #555;
    padding: 1rem;
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 2rem;
  }
  .session-item, .gallery-item {
    border-bottom: 1px solid #444;
    padding: 0.5rem 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .session-item:last-child, .gallery-item:last-child {
    border-bottom: none;
  }
  .session-item button, .gallery-item button {
    background: #4caf50;
    margin: 0;
    padding: 0.3rem 0.7rem;
  }
  .session-item button:hover, .gallery-item button:hover {
    background: #388e3c;
  }
  #username-container {
    margin-bottom: 1rem;
  }
  #username-input {
    padding: 0.4rem;
    font-size: 1rem;
    width: 200px;
    margin-right: 0.5rem;
  }
  #status-msg {
    margin-top: 1rem;
    font-style: italic;
  }
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>
  <h1>Pixel Art Collaborative Lobby</h1>

  <div id="user-info">
    Logged in as: <span id="display-username">Guest</span>
    <button id="logout-btn">Logout</button>
  </div>

  <div id="username-container">
    <input type="text" id="username-input" placeholder="Set your username" maxlength="20" />
    <button id="set-username-btn">Save Username</button>
  </div>

  <div id="session-controls">
    <button id="create-session-btn">Create New Art Session</button>
  </div>

  <h2>Active Art Sessions</h2>
  <div id="sessions-list">
    <!-- Active sessions will list here -->
  </div>

  <h2>Published Pixel Art Gallery</h2>
  <div id="gallery-list">
    <!-- Published pixel arts will list here -->
  </div>

  <div id="status-msg"></div>

  <script src="lobby.js"></script>
</body>
</html>
