<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Art Lobby</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0; padding: 0;
    }
    #session-list {
      margin-top: 15px;
      width: 90vw;
      max-width: 800px;
      background: #333;
      padding: 10px;
      border-radius: 6px;
      max-height: 400px;
      overflow-y: auto;
    }
    button {
      margin: 10px 0;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      background: #444;
      color: #eee;
    }
    button:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <h1>Pixel Art Lobby</h1>
  <button id="create-session-btn">Create New Art Session</button>
  <div id="session-list"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="lobby.js"></script>
</body>
</html>
