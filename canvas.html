<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborative Pixel Art</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0; background: #222; color: #eee;
      display: flex; flex-direction: column; align-items: center;
    }
    #pixelCanvas {
      border: 1px solid #555;
      margin-top: 10px;
      cursor: crosshair;
      background: #fff;
      display: block;
      max-width: 100vw;
      max-height: 80vh;
      overflow: auto;
    }
    #toolbar {
      margin-top: 10px;
    }
    button, input[type="color"], input[type="number"] {
      margin-right: 10px;
      padding: 5px 10px;
      font-size: 16px;
    }
    #chat {
      width: 90vw;
      max-width: 800px;
      margin-top: 15px;
      background: #333;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
    }
    #chat-messages {
      height: 150px;
      overflow-y: auto;
      background: #222;
      padding: 5px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-family: monospace;
      font-size: 14px;
      color: #eee;
    }
    #chat-text {
      width: 100%;
      box-sizing: border-box;
      padding: 5px;
      font-size: 16px;
      border-radius: 4px;
      border: none;
      outline: none;
    }
    #export-import {
      display: none;
      margin-top: 10px;
      width: 90vw;
      max-width: 800px;
      background: #444;
      padding: 10px;
      border-radius: 6px;
    }
    #import-textarea {
      width: 100%;
      height: 120px;
      font-family: monospace;
      font-size: 14px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: none;
      resize: vertical;
    }
  </style>
</head>
<body>
  <h1>Collaborative Pixel Art</h1>

  <div id="toolbar">
    <input type="color" id="color-picker" value="#000000" />
    <input type="number" id="brush-size" value="1" min="1" max="10" />
    <button id="eraser-btn">Eraser</button>
    <button id="undo-btn">Undo</button>
    <button id="redo-btn">Redo</button>
    <button id="export-btn">Export</button>
    <button id="import-btn">Import</button>
    <button id="publish-btn" style="display:none;">Publish</button>
    <button id="logout-btn">Logout</button>
  </div>

  <canvas id="pixelCanvas" tabindex="0"></canvas>

  <div id="export-import">
    <textarea id="import-textarea" placeholder="Paste JSON here to import"></textarea><br />
    <button id="import-confirm-btn">Confirm Import</button>
  </div>

  <div id="chat">
    <div id="chat-messages"></div>
    <input type="text" id="chat-text" placeholder="Type message and press enter" />
    <button id="chat-send-btn">Send</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
