<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rust RCON Console</title>
  <style>
    body { font-family: Inter, system-ui, Arial; max-width: 980px; margin: 20px auto; padding: 10px; }
    .card { border:1px solid #ddd; padding:12px; border-radius:8px; margin-bottom:12px; }
    label { display:block; margin-top:6px; font-weight:600; }
    input, button, textarea, select { width:100%; padding:8px; margin-top:6px; box-sizing:border-box; }
    #output { height:220px; font-family: monospace; white-space: pre-wrap; overflow:auto; }
    .hidden { display:none; }
    .muted { color:#666; font-size:0.9em; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    .btn { cursor:pointer; }
  </style>
</head>
<body>
  <h1>Rust RCON Console</h1>

  <div id="auth-card" class="card">
    <div id="register-area">
      <h3>Register</h3>
      <label>Username</label>
      <input id="reg-username" placeholder="username" />
      <label>Email</label>
      <input id="reg-email" placeholder="you@example.com" />
      <label>Password</label>
      <input id="reg-password" type="password" />
      <button id="btn-register" class="btn">Register</button>
      <div class="muted">Registration creates an account but you must be <strong>approved</strong> by the master (Lambertio) before sending RCON commands.</div>
    </div>

    <hr>

    <div id="login-area">
      <h3>Login (username + password)</h3>
      <label>Username</label>
      <input id="login-username" />
      <label>Password</label>
      <input id="login-password" type="password" />
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button id="btn-login" class="btn">Login</button>
        <button id="btn-logout" class="btn hidden">Logout</button>
      </div>
      <div id="login-status" class="muted"></div>
    </div>
  </div>

  <div id="console-card" class="card hidden">
    <h3>RCON Console</h3>
    <div class="muted">Only visible if your account is approved.</div>
    <label>Command</label>
    <input id="cmd-input" placeholder="status" />
    <div style="display:flex; gap:10px; margin-top:8px;">
      <button id="btn-send" class="btn">Send</button>
      <button id="btn-clear" class="btn">Clear Output</button>
    </div>
    <label>Output</label>
    <textarea id="output" readonly></textarea>
  </div>

  <div id="admin-card" class="card hidden">
    <h3>Admin Panel (Master: Lambertio)</h3>
    <div class="muted">Approve or deny user accounts.</div>
    <div id="pending-list"></div>
  </div>
