<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rust RCON Console - Simple Login</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 10px; }
  label, button { display: block; margin-top: 10px; }
  input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
  .hidden { display: none; }
  #rcon-password { font-weight: bold; background: #eee; padding: 8px; margin-top: 10px; user-select: all; }
  #login-status { margin-top: 15px; color: green; }
</style>
</head>
<body>

<h1>Rust RCON Console (Simple Login)</h1>

<div id="login-section">
  <h2>Login</h2>
  <label for="login-email">Email</label>
  <input type="email" id="login-email" placeholder="Email" />
  
  <label for="login-password">Password</label>
  <input type="password" id="login-password" />
  
  <button id="btn-login">Login</button>
  <button id="btn-logout" class="hidden">Logout</button>
  <div id="login-status"></div>
</div>

<hr />

<div id="rcon-section" class="hidden">
  <h2>Your RCON Password</h2>
  <div id="rcon-password" title="Click to copy password"></div>
  <small>Use this password in your favorite RCON client to connect to your Rust server.</small>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore.js";

  // Your Firebase config - replace with your actual config
  const firebaseConfig = {
    apiKey: "AIzaSyDXRSt2pmgqChOGJr4gr9e2Z_tZaGxBpoo",
    authDomain: "shildonia-38aab.firebaseapp.com",
    projectId: "shildonia-38aab",
    storageBucket: "shildonia-38aab.firebasestorage.app",
    messagingSenderId: "963502122644",
    appId: "1:963502122644:web:adbd0976dab04f25f07681",
    measurementId: "G-MQJ2D3SPTS"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Elements
  const loginEmail = document.getElementById('login-email');
  const loginPassword = document.getElementById('login-password');
  const btnLogin = document.getElementById('btn-login');
  const btnLogout = document.getElementById('btn-logout');
  const loginStatus = document.getElementById('login-status');

  const rconSection = document.getElementById('rcon-section');
  const rconPasswordDiv = document.getElementById('rcon-password');

  // Login user
  btnLogin.addEventListener('click', async () => {
    const email = loginEmail.value.trim();
    const password = loginPassword.value;
    if (!email || !password) return alert('Fill email and password.');

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      alert('Login failed: ' + err.message);
    }
  });

  // Logout user
  btnLogout.addEventListener('click', () => signOut(auth));

  // Copy password on click
  rconPasswordDiv.addEventListener('click', () => {
    navigator.clipboard.writeText(rconPasswordDiv.textContent);
    alert('Password copied to clipboard');
  });

  // Auth state change handler
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      loginStatus.textContent = 'Not logged in';
      btnLogout.classList.add('hidden');
      btnLogin.classList.remove('hidden');
      rconSection.classList.add('hidden');
      return;
    }

    btnLogout.classList.remove('hidden');
    btnLogin.classList.add('hidden');

    // Load user doc to check approval
    const docRef = doc(db, 'users', user.uid);
    const docSnap = await getDoc(docRef);

    if (!docSnap.exists()) {
      loginStatus.textContent = 'User record missing. Contact admin.';
      rconSection.classList.add('hidden');
      return;
    }

    const userData = docSnap.data();

    if (!userData.isApproved) {
      loginStatus.textContent = 'Your account is not yet approved by admin.';
      rconSection.classList.add('hidden');
      return;
    }

    loginStatus.textContent = `Logged in as ${userData.username || user.email}`;

    // Get RCON password from Firestore (you must manually create this doc)
    try {
      const pwDoc = await getDoc(doc(db, 'config', 'rcon'));
      if (!pwDoc.exists()) {
        rconPasswordDiv.textContent = 'RCON password not set in Firestore.';
      } else {
        const rconData = pwDoc.data();
        rconPasswordDiv.textContent = rconData.password || 'No password found.';
      }
      rconSection.classList.remove('hidden');
    } catch (err) {
      rconPasswordDiv.textContent = 'Error loading RCON password.';
      rconSection.classList.remove('hidden');
    }
  });
</script>

</body>
</html>
